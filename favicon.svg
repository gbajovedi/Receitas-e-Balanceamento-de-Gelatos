<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Amber Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Pistachio Scoop Gradient -->
    <linearGradient id="pistachio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Fior di Latte / Cream Gradient -->
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Salted Caramel / Amber Scoop Gradient -->
    <linearGradient id="amberCaramel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Stainless Cup Gradient -->
    <linearGradient id="steelCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Base: Squircle with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#ambientGlow)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Centered Graphic Group with drop shadow -->
  <g filter="url(#shadow)">
    <!-- 1. LEFT SCOOP: Creamy Pistachio -->
    <circle cx="205" cy="205" r="75" fill="url(#pistachio)"/>
    <!-- Highlight on pistachio -->
    <ellipse cx="185" cy="175" rx="35" ry="20" fill="#a7f3d0" fill-opacity="0.45" transform="rotate(-25 185 175)"/>

    <!-- 2. RIGHT SCOOP: Cream / Fior di Latte -->
    <circle cx="310" cy="205" r="75" fill="url(#cream)"/>
    <!-- Highlight on cream -->
    <ellipse cx="325" cy="175" rx="35" ry="20" fill="#ffffff" fill-opacity="0.6" transform="rotate(25 325 175)"/>

    <!-- 3. TOP / CENTER SCOOP: Warm Caramel Gelato with swirl -->
    <circle cx="256" cy="155" r="82" fill="url(#amberCaramel)"/>
    <!-- Creamy wavy swirl on top -->
    <path d="M215 140 C 235 110, 275 110, 295 140 C 285 160, 245 160, 215 140 Z" fill="#fef08a" fill-opacity="0.65"/>
    <ellipse cx="240" cy="130" rx="38" ry="18" fill="#ffffff" fill-opacity="0.4" transform="rotate(-15 240 130)"/>

    <!-- 4. GOLDEN ARTISAN SPATULA / PALETTA -->
    <g transform="rotate(22 280 180)">
      <path d="M285 70 C 295 70, 305 78, 305 88 L 300 170 C 298 178, 292 182, 285 182 C 278 182, 272 178, 270 170 L 265 88 C 265 78, 275 70, 285 70 Z" fill="url(#gold)" filter="url(#glow)"/>
      <line x1="285" y1="85" x2="285" y2="165" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.6"/>
    </g>

    <!-- 5. ITALIAN COPPA (BOWL & STEM) -->
    <!-- Bowl Body -->
    <path d="M140 220 C 140 315, 200 340, 256 345 C 312 340, 372 315, 372 220 Z" fill="url(#steelCup)"/>
    <!-- Bowl Rim Highlight -->
    <ellipse cx="256" cy="220" rx="116" ry="14" fill="#f8fafc" fill-opacity="0.9"/>
    <ellipse cx="256" cy="220" rx="110" ry="10" fill="#94a3b8" fill-opacity="0.4"/>
    <!-- Bowl Body Specular Reflection -->
    <path d="M190 232 C 185 275, 205 315, 230 338 C 215 320, 200 280, 202 232 Z" fill="#ffffff" fill-opacity="0.45"/>

    <!-- Stem & Base -->
    <path d="M246 345 L 246 405 C 220 408, 185 418, 185 435 L 327 435 C 327 418, 292 408, 266 405 L 266 345 Z" fill="url(#steelCup)"/>
    <!-- Base Highlight -->
    <ellipse cx="256" cy="433" rx="70" ry="6" fill="#f8fafc" fill-opacity="0.8"/>
  </g>

  <!-- Precision Star / Badge (Subtle top right) -->
  <g transform="translate(400, 75)" filter="url(#glow)">
    <circle cx="0" cy="0" r="16" fill="url(#gold)"/>
    <path d="M0 -10 L2.5 -3 L10 0 L2.5 3 L0 10 L-2.5 3 L-10 0 L-2.5 -3 Z" fill="#0f172a"/>
  </g>
</svg>